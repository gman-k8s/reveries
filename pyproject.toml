[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reveries"
version = "0.1.0"
description = "Kleine, sarkastische Eigenheiten für deterministische Antworten – String-Matching statt LLM."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/gman-k8s/reveries"

[project.scripts]
reveries = "reveries.__main__:main"

[tool.setuptools]
packages = ["reveries"]

[tool.pytest.ini_options]
testpaths = ["tests"]
